# Starter inventory. Add hosts a few at a time as you bring them under Ansible management —
# no need to add all 30 services on day one.
#
# Tip: `ansible all -m ping` to sanity-check connectivity once a group has entries.

all:
  children:
    proxmox_host:
      hosts:
        host1:
          ansible_host: 192.168.1.10
        pve2:
          ansible_host: 192.168.1.12
        pve3:
          ansible_host: 192.168.1.13

    lxc:
      hosts:
        # dfs-namespace:
        #   ansible_host: 192.168.1.230
        {}

    docker_hosts:
      hosts:
        # add your docker VMs (111, 124) here once you're ready to manage them
        {}

    tf_managed:
      # hosts created by terraform/proxmox land here as you add them
      hosts: {}
