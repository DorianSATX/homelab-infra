# Starter inventory. Add hosts a few at a time as you bring them under Ansible management —
# no need to add all 30 services on day one.
#
# Tip: `ansible all -m ping` to sanity-check connectivity once a group has entries.

all:
  children:
    proxmox_host:
      hosts:
        host1:
          ansible_host: 192.0.2.1
        pve2:
          ansible_host: 192.0.2.1
        pve3:
          ansible_host: 192.0.2.1
    pbs:
      hosts:
        pbs1:
          ansible_host: 192.0.2.1

    nvr:
      hosts:
        nvrDV:
          ansible_host: 192.0.2.1
          ansible_user: dorian
          scrutiny_device_overrides:
            - { device: /dev/sda, type: sat }
            - { device: /dev/sdb, type: sat }
    lxc:
      hosts:
        # dfs-namespace:
        #   ansible_host: 192.0.2.1
        {}

    docker_hosts:
      hosts:
        # add your docker VMs (111, 124) here once you're ready to manage them
        {}

    tf_managed:
      hosts:
        k3s1:
          ansible_host: 192.0.2.1
          ansible_user: debian
        k3s2:
          ansible_host: 192.0.2.1
          ansible_user: debian
        k3s3:
          ansible_host: 192.0.2.1
          ansible_user: debian
    k3s_first_server:
      hosts:
        k3s1: {}
    k3s_additional_servers:
      hosts:
        k3s2: {}
        k3s3: {}
