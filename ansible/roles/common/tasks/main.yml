---
# Baseline role applied to every host under management: updates, agent, sane defaults.
# Extend per-service roles alongside this one rather than piling everything in here.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_os_family == "Debian"

- name: Ensure qemu-guest-agent is installed (VMs only, harmless on LXC)
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: ansible_os_family == "Debian"
  failed_when: false   # optional package; never fail the play over it

- name: Set timezone
  community.general.timezone:
    name: America/Chicago
